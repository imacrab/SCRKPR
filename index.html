<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve on
         notched iPhones; without it the app's safe-area padding is a no-op. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4EFE3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SCRKPR" />
    <style>
      html, body, #root {
        background-color: #F4EFE3;
      }
      html.dark, html.dark body, html.dark #root {
        background-color: #20242C;
      }
      html, body, #root {
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
      }
      #root {
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
      }
      body {
        overscroll-behavior: none;
        touch-action: manipulation;
      }
    </style>
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>SCRKPR</title>
    <script>
      // Mirrors src/lib/theme.js so the right theme paints before React loads.
      try {
        var pref = localStorage.getItem("scrkpr_theme");
        var dark = pref === "dark" || (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
