<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve on
         notched iPhones; without it the app's safe-area padding is a no-op. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#262729" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SCRKPR" />
    <!-- Fullscreen sizing per iOS Game UI guide, Section 2 + Section 8:
         - PWA standalone: `100vh` is the only unit that works from cold start
           (`100%` breaks viewport-fit=cover; `100dvh` returns stale values).
         - Safari (in-browser): `100vh` INCLUDES the area behind the toolbar,
           so content extends below the visible viewport. `100dvh` fixes this
           in Safari (the cold-start bug only affects standalone PWAs).
         We branch on `display-mode: standalone` to give each context the
         right unit. -->
    <style>
      html, body, #root {
        background-color: #262729;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100vw;
        height: 100dvh; /* Safari default — respects the toolbar */
        overflow: hidden;
      }
      #root {
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
      }
      @media all and (display-mode: standalone) {
        html, body, #root { height: 100vh; }
      }
      body {
        overscroll-behavior: none;
        touch-action: manipulation;
      }
    </style>
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>SCRKPR</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
