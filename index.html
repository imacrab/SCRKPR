<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve on
         notched iPhones; without it the app's safe-area padding is a no-op. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SCRKPR" />
    <!-- Fullscreen PWA sizing per iOS Game UI guide, Section 2: `height: 100%`
         silently breaks `viewport-fit=cover` + `black-translucent` (Safari
         falls back to non-cover layout, leaving a gap at the safe-area zone),
         and `100dvh` reports stale values on PWA cold start. `100vh` is the
         only unit that works from cold start in standalone mode. -->
    <style>
      html, body, #root {
        background-color: #111111;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      #root {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      body {
        overscroll-behavior: none;
        touch-action: manipulation;
      }
    </style>
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>SCRKPR</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
